# This station is the time authority for the isolated network.
local stratum 8
manual

# Replace with your actual network.
# This is correct if your subnet is 192.168.0.0/18.
allow 192.168.0.0/18

driftfile /var/lib/chrony/chrony.drift
keyfile /etc/chrony/chrony.keys
logdir /var/log/chrony

maxupdateskew 100.0
makestep 1.0 3
rtcsync
